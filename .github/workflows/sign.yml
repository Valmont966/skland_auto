name: 森空岛每日签到

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到
        env:
          SKLAND_TOKEN: ${{ secrets.SKLAND_TOKEN }}
        run: python skland_sign_github.py
